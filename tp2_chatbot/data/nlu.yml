version: "3.1"
 
nlu:
  # ------------------------------------------------------------------
  # Conversation de base
  # ------------------------------------------------------------------
  - intent: saluer
    examples: |
      - Bonjour
      - Bonsoir
      - Salut
      - Coucou
      - Hello
      - Hey
      - Bonjour chef
      - Salut, ça va ?
      - Mbote
      - Bonne journée
      - Allô
 
  - intent: au_revoir
    examples: |
      - Au revoir
      - À plus
      - À bientôt
      - À demain
      - Bye
      - Salut, à plus tard
      - Je m'en vais
      - Bonne soirée
      - Bonne nuit
      - Ce sera tout, au revoir
      - Tchao
 
  - intent: remercier
    examples: |
      - Merci
      - Merci beaucoup
      - Merci bien
      - Je te remercie
      - Super, merci
      - Génial, merci !
      - Parfait, merci
      - Thanks
      - Merci pour l'info
      - C'est gentil, merci
 
  - intent: demander_aide
    examples: |
      - Aide
      - À l'aide
      - Que sais-tu faire ?
      - Que peux-tu faire ?
      - Comment ça marche ?
      - Comment t'utiliser ?
      - Peux-tu m'aider ?
      - Qu'est-ce que tu peux me dire ?
      - Donne-moi des exemples
      - Quelles sont tes fonctionnalités ?
      - Tu sers à quoi ?
 
  # ------------------------------------------------------------------
  # Météo actuelle d'une ville
  # ------------------------------------------------------------------
  - intent: meteo_actuelle
    examples: |
      - Quel temps fait-il à [Goma](ville) ?
      - Quel temps fait-il à [Kinshasa](ville) ?
      - Quel temps il fait à [Lubumbashi](ville) ?
      - Météo à [Bukavu](ville)
      - Météo de [Kisangani](ville)
      - Donne-moi la météo de [Matadi](ville)
      - Il fait combien de degrés à [Mbuji-Mayi](ville) ?
      - Quelle est la température à [Kolwezi](ville) ?
      - Il fait chaud à [Kalemie](ville) en ce moment ?
      - Quelle est la météo actuelle à [Bunia](ville) ?
      - Je veux connaître le temps à [Kananga](ville)
      - Dis-moi le temps qu'il fait à [Mbandaka](ville)
      - Météo [Uvira](ville)
      - Quel est le taux d'humidité à [Butembo](ville) ?
      - Y a-t-il du vent à [Kindu](ville) ?
      - Quel temps fait-il ?
      - Donne-moi la météo actuelle
      - Il fait quel temps dehors ?
 
  # ------------------------------------------------------------------
  # Prévision d'une ville
  # ------------------------------------------------------------------
  - intent: prevision_ville
    examples: |
      - Va-t-il pleuvoir [demain](jour) à [Bukavu](ville) ?
      - Va-t-il pleuvoir [aujourd'hui](jour) à [Goma](ville) ?
      - Quel temps fera-t-il [demain](jour) à [Kinshasa](ville) ?
      - Quelle est la prévision pour [Lubumbashi](ville) [demain](jour) ?
      - Prévisions météo pour [Kisangani](ville)
      - Prévision de [Matadi](ville) [après-demain](jour)
      - Quel temps [après-demain](jour) à [Kananga](ville) ?
      - Pleuvra-t-il [demain](jour) à [Kolwezi](ville) ?
      - Donne-moi la météo de [Bunia](ville) pour [demain](jour)
      - Météo [demain](jour) à [Mbandaka](ville)
      - Prévisions pour [Kalemie](ville) [aujourd'hui](jour)
      - Quelle température fera-t-il [après-demain](jour) à [Uvira](ville) ?
      - Je voudrais la prévision de [Beni](ville) pour [demain](jour)
      - Est-ce qu'il va pleuvoir à [Mbuji-Mayi](ville) [demain](jour) ?
      - Prévision pour [Kikwit](ville)
      - Va-t-il faire chaud [demain](jour) à [Boma](ville) ?
      - Il pleuvra à [Goma](ville) [après demain](jour) ?
      - Quelle sera la météo [demain](jour) ?
 
  # ------------------------------------------------------------------
  # Prévision d'une province
  # ------------------------------------------------------------------
  - intent: prevision_province
    examples: |
      - Prévisions pour le [Haut-Katanga](province)
      - Prévisions pour la province du [Lualaba](province)
      - Quel temps fait-il dans le [Nord-Kivu](province) ?
      - Météo du [Sud-Kivu](province)
      - Prévision de la province de l'[Ituri](province)
      - Quelle est la météo dans le [Kongo Central](province) ?
      - Prévisions pour le [Bas-Congo](province)
      - Météo de la province du [Kwilu](province) [demain](jour)
      - Va-t-il pleuvoir [demain](jour) dans la [Tshopo](province) ?
      - Prévisions pour le [Tanganyika](province) [après-demain](jour)
      - Donne-moi la météo du [Haut-Lomami](province)
      - Quel temps dans le [Kasaï-Central](province) ?
      - Prévision pour la province de l'[Équateur](province)
      - Météo [Kin](province)
      - Province du [Maniema](province), quelles sont les prévisions ?
      - Prévisions pour le [Mai-Ndombe](province) [aujourd'hui](jour)
      - Quel temps fera-t-il dans le [Kasaï-Oriental](province) ?
      - Météo de la province du [Sankuru](province)
      - Prévisions pour le [Haut-Uele](province)
      - Et pour le [Kwango](province) ?
 
  # ------------------------------------------------------------------
  # Bulletin des 26 provinces
  # ------------------------------------------------------------------
  - intent: bulletin_rdc
    examples: |
      - Donne-moi la météo de toutes les provinces
      - Météo des 26 provinces
      - Bulletin météo RDC
      - Bulletin RDC
      - Bulletin météo des provinces de la RDC
      - Je veux la météo de toute la RDC
      - Quel temps fait-il dans tout le pays ?
      - Prévisions pour toutes les provinces
      - Météo nationale
      - Montre-moi le bulletin météo du pays
      - Donne le bulletin des 26 provinces
      - Météo RDC
 
