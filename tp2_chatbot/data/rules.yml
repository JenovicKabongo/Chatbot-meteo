version: "3.1"
 
rules:
  - rule: Répondre aux salutations
    steps:
      - intent: saluer
      - action: utter_saluer
 
  - rule: Répondre aux adieux
    steps:
      - intent: au_revoir
      - action: utter_au_revoir
 
  - rule: Répondre aux remerciements
    steps:
      - intent: remercier
      - action: utter_remercier
 
  - rule: Présenter les fonctionnalités
    steps:
      - intent: demander_aide
      - action: utter_aide
 
  - rule: Donner la météo actuelle d'une ville
    steps:
      - intent: meteo_actuelle
      - action: action_meteo_actuelle
 
  - rule: Donner la prévision d'une ville
    steps:
      - intent: prevision_ville
      - action: action_prevision_ville
 
  - rule: Donner la prévision d'une province
    steps:
      - intent: prevision_province
      - action: action_prevision_province
 
  - rule: Donner le bulletin des 26 provinces
    steps:
      - intent: bulletin_rdc
      - action: action_bulletin_rdc
 
  - rule: Message de repli quand le bot ne comprend pas
    steps:
      - intent: nlu_fallback
      - action: utter_default