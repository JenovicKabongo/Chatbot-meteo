recipe: default.v1

# IMPORTANT : si `rasa init` a généré une ligne `assistant_id: ...` dans ton
# ancien config.yml, recopie-la ici (ou laisse Rasa la regénérer).
language: fr

pipeline:
- name: WhitespaceTokenizer
- name: RegexFeaturizer
- name: LexicalSyntacticFeaturizer
- name: CountVectorsFeaturizer
- name: CountVectorsFeaturizer
  analyzer: char_wb
  min_ngram: 1
  max_ngram: 4
- name: DIETClassifier
  epochs: 100
  constrain_similarities: true
  # Utilise les tables de recherche (ville, province) de nlu.yml
- name: RegexEntityExtractor
  use_lookup_tables: true
  use_regexes: false
  case_sensitive: false
  use_word_boundaries: true
- name: EntitySynonymMapper
- name: FallbackClassifier
  threshold: 0.5
  ambiguity_threshold: 0.1

policies:
- name: MemoizationPolicy
- name: RulePolicy
- name: UnexpecTEDIntentPolicy
  max_history: 5
  epochs: 100
- name: TEDPolicy
  max_history: 5
  epochs: 100
  constrain_similarities: true
assistant_id: 20261105-223125-cyclic-contract
